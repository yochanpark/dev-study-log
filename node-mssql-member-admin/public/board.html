<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 목록</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: "Nanum Gothic", Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .container {
            background-color: #fff;
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1680px;
            margin-top: 50px;
            box-sizing: border-box;
        }

        h1 { font-size: 22px; color: #333; margin-bottom: 20px; text-align: center; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }

        th, td { border-bottom: 1px solid #ddd; padding: 12px; font-size: 14px; text-align: center; }

        th { background-color: #4e73df; color: white; }

        .col-number { width: 15%; }
        .col-id, .col-name { width: 37.5%; }

        .top-buttons { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; }

        .top-buttons button {
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #add-btn { background-color: #4e73df; }
        #logout-btn { background-color: #f44336; }

        .edit-btn { background-color: #4CAF50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        #pagination { text-align: center; margin-top: 20px; }

        .page-btn { padding: 5px 10px; margin: 0 5px; border: 1px solid #ddd; background-color: #f4f4f4; cursor: pointer; }

        .page-btn:disabled { background-color: #ddd; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="top-buttons">
        <button id="add-btn">회원 추가</button>
        <button id="logout-btn">로그아웃</button>
    </div>
    <div class="container">
        <h1>회원 관리 목록</h1>
        <table>
            <thead>
                <tr>
                    <th class="col-number">순번</th>
                    <th class="col-id">아이디</th>
                    <th class="col-name">이름</th>
                    <th>수정</th>
                </tr>
            </thead>
            <tbody id="board-list"></tbody>
        </table>
        <div id="pagination"></div>
    </div>

    <script src="board.js"></script>
</body>
</html>
